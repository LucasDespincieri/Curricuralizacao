# Define o nome da aplicação Spring Boot no contexto do ecossistema Spring
spring.application.name=Curriruralizacao

# ================================================================
# Configurações de Conexão com o Banco de Dados MySQL
# ================================================================
# URL de conexão com o MySQL (ajuste o host, porta e nome do banco conforme necessário)
# createDatabaseIfNotExist=true: cria o banco de dados automaticamente se não existir
# allowPublicKeyRetrieval=true & useSSL=false: previne erros comuns de autenticação no MySQL 8+
spring.datasource.url=jdbc:mysql://localhost:3306/curriruralizacao?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================================================
# Configurações do Spring Data JPA / Hibernate
# ================================================================
# ddl-auto: 'update' atualiza as tabelas automaticamente de acordo com as entidades JPA
spring.jpa.hibernate.ddl-auto=update

# Exibir os comandos SQL executados no console
# Configurações do Spring Data JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Evita manter a sessão JPA aberta durante toda a renderização da view
spring.jpa.open-in-view=false

# ================================================================
# Deploy (Render): porta e pool de conexoes
# ================================================================
# O Render define a porta pela variavel PORT; localmente continua 8080
server.port=${PORT:8080}
# Instancia gratis tem pouca memoria: poucas conexoes bastam
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
